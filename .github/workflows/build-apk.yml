name: JAM System Pro - Build & Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-apk:
    name: 📱 Build APK - ${{ matrix.variant.name_ar }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant:
          - code: "JAM_STORE"
            name_ar: "Jam store"
            package_id: "com.jam.store"
            apk_filename: "Jam-Store.apk"
            artifact_name: "Jam-Store-APK"

          - code: "JAM_CUSTOMER_VIP"
            name_ar: "Store pro"
            package_id: "com.jam.storepro"
            apk_filename: "Store-Pro.apk"
            artifact_name: "Store-Pro-APK"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Clean Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install sharp png-to-ico acorn --save-dev --legacy-peer-deps

      - name: 🌐 Build Web Assets (${{ matrix.variant.code }})
        env:
          VITE_APP_VARIANT: ${{ matrix.variant.code }}
        run: |
          npm run build
          node scripts/obfuscate.cjs || true

      - name: ⚙️ Setup Capacitor Config
        run: |
          node -e "
          const fs = require('fs');
          const config = {
            appId: '${{ matrix.variant.package_id }}',
            appName: '${{ matrix.variant.name_ar }}',
            webDir: 'dist',
            android: {
              allowMixedContent: true,
              captureInput: false,
              backgroundColor: '#05070e'
            }
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "

      - name: 📲 Add & Sync Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 🛠️ Patch AndroidManifest, Versioning & Permissions
        run: |
          node -e "
          const fs = require('fs');
          
          // 1. Set App Name in strings.xml
          const strPath = 'android/app/src/main/res/values/strings.xml';
          if (fs.existsSync(strPath)) {
            let str = fs.readFileSync(strPath, 'utf8');
            str = str.replace(/<string name=\"app_name\">.*?<\/string>/, '<string name=\"app_name\">${{ matrix.variant.name_ar }}</string>');
            fs.writeFileSync(strPath, str, 'utf8');
            console.log('✅ Updated app_name to: ${{ matrix.variant.name_ar }}');
          }

          // 2. Set MinSdkVersion to 24 in variables.gradle
          const varPath = 'android/variables.gradle';
          if (fs.existsSync(varPath)) {
            let varContent = fs.readFileSync(varPath, 'utf8');
            varContent = varContent.replace(/minSdkVersion\s*=\s*\d+/g, 'minSdkVersion = 24');
            varContent = varContent.replace(/compileSdkVersion\s*=\s*\d+/g, 'compileSdkVersion = 34');
            varContent = varContent.replace(/targetSdkVersion\s*=\s*\d+/g, 'targetSdkVersion = 34');
            fs.writeFileSync(varPath, varContent, 'utf8');
            console.log('✅ Injected minSdkVersion = 24, compileSdkVersion = 34 in variables.gradle');
          }

          // 3. Set Incremental VersionCode & VersionName in build.gradle & enforce minSdk 24
          const gradlePath = 'android/app/build.gradle';
          if (fs.existsSync(gradlePath)) {
            let gradle = fs.readFileSync(gradlePath, 'utf8');
            const runNum = parseInt('${{ github.run_number }}', 10) || 1;
            const newVersionCode = 2800 + runNum;
            gradle = gradle.replace(/versionCode \d+/, 'versionCode ' + newVersionCode);
            gradle = gradle.replace(/versionName \"[^\"]+\"/, 'versionName \"4.0.1\"');
            gradle = gradle.replace(/minSdkVersion\s+rootProject\.ext\.minSdkVersion/, 'minSdkVersion 24');
            gradle = gradle.replace(/minSdkVersion\s+\d+/, 'minSdkVersion 24');
            fs.writeFileSync(gradlePath, gradle, 'utf8');
            console.log('✅ Injected versionCode: ' + newVersionCode + ', versionName: 4.0.1, minSdkVersion: 24');
          }

          // 4. Inject Permissions & Security in AndroidManifest.xml cleanly (with xmlns:tools and overrideLibrary)
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, 'utf8');
            
            // Ensure xmlns:tools is present on <manifest>
            if (!manifest.includes('xmlns:tools=')) {
              manifest = manifest.replace('<manifest', '<manifest xmlns:tools=\"http://schemas.android.com/tools\"');
            }

            // Fix attributes on <application> tag safely
            manifest = manifest.replace(/android:allowBackup=\"[^\"]*\"/g, 'android:allowBackup=\"false\"');
            manifest = manifest.replace(/android:debuggable=\"[^\"]*\"/g, '');
            
            if (!manifest.includes('android:usesCleartextTraffic')) {
              manifest = manifest.replace('<application', '<application android:usesCleartextTraffic=\"true\"');
            }
            if (!manifest.includes('android:requestLegacyExternalStorage')) {
              manifest = manifest.replace('<application', '<application android:requestLegacyExternalStorage=\"true\"');
            }
            if (!manifest.includes('android:windowSoftInputMode')) {
              manifest = manifest.replace('<activity', '<activity android:windowSoftInputMode=\"adjustResize\"');
            }

            // Override sqlcipher library minSdk restriction
            if (!manifest.includes('tools:overrideLibrary=\"net.zetetic.database\"')) {
              manifest = manifest.replace('<application', '    <uses-sdk tools:overrideLibrary=\"net.zetetic.database\" />\n    <application');
            }

            // Permissions to ensure all hardware features (Bluetooth, Camera, Audio, Network) work
            const perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.ACCESS_WIFI_STATE',
              'android.permission.CHANGE_WIFI_STATE',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.VIBRATE',
              'android.permission.WAKE_LOCK',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.BLUETOOTH',
              'android.permission.BLUETOOTH_ADMIN',
              'android.permission.BLUETOOTH_CONNECT',
              'android.permission.BLUETOOTH_SCAN',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE'
            ];

            let toInject = '';
            for (const p of perms) {
              if (!manifest.includes('android:name=\"' + p + '\"')) {
                toInject += '    <uses-permission android:name=\"' + p + '\" />\n';
              }
            }
            if (!manifest.includes('android.hardware.camera')) {
              toInject += '    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n';
            }
            if (!manifest.includes('android.hardware.bluetooth')) {
              toInject += '    <uses-feature android:name=\"android.hardware.bluetooth\" android:required=\"false\" />\n';
            }

            if (toInject) {
              manifest = manifest.replace('<application', toInject + '    <application');
            }

            fs.writeFileSync(manifestPath, manifest, 'utf8');
            console.log('✅ AndroidManifest.xml successfully patched and verified');
          }
          "

      - name: 🎨 Deploy 1:1 Frozen App Icons & Android Mipmaps
        run: |
          node scripts/inject-frozen-icons.cjs ${{ matrix.variant.code }}

      - name: ⚡ Configure Gradle Memory & AndroidX
        run: |
          mkdir -p android
          cat << 'EOF' >> android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.overridePathCheck=true
          android.suppressUnsupportedCompileSdk=34
          EOF

          # Directly update gradle-wrapper.properties to Gradle 8.7 which has ASM 9.6
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-.*\.zip/gradle-8.7-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
            echo "✅ Configured gradle-wrapper.properties to gradle-8.7-bin.zip"
          fi

          # Global Gradle init script: forces BouncyCastle 1.77 on every single configuration and buildscript
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/bouncycastle.gradle
          allprojects {
              buildscript {
                  configurations.all {
                      resolutionStrategy {
                          force 'org.bouncycastle:bcprov-jdk18on:1.77'
                          force 'org.bouncycastle:bcpkix-jdk18on:1.77'
                          force 'org.bouncycastle:bcutil-jdk18on:1.77'
                      }
                  }
              }
              configurations.all {
                  resolutionStrategy {
                      force 'org.bouncycastle:bcprov-jdk18on:1.77'
                      force 'org.bouncycastle:bcpkix-jdk18on:1.77'
                      force 'org.bouncycastle:bcutil-jdk18on:1.77'
                  }
              }
          }
          EOF

          # Inject BouncyCastle 1.77 directly into android buildscripts
          node -e "
          const fs = require('fs');
          const rootGradle = 'android/build.gradle';
          if (fs.existsSync(rootGradle)) {
            let content = fs.readFileSync(rootGradle, 'utf8');
            content = 'buildscript {\n    configurations.all {\n        resolutionStrategy {\n            force \"org.bouncycastle:bcprov-jdk18on:1.77\"\n            force \"org.bouncycastle:bcpkix-jdk18on:1.77\"\n            force \"org.bouncycastle:bcutil-jdk18on:1.77\"\n        }\n    }\n}\n' + content;
            content += '\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            force \"org.bouncycastle:bcprov-jdk18on:1.77\"\n            force \"org.bouncycastle:bcpkix-jdk18on:1.77\"\n            force \"org.bouncycastle:bcutil-jdk18on:1.77\"\n        }\n    }\n}\n';
            fs.writeFileSync(rootGradle, content, 'utf8');
            console.log('✅ Injected BouncyCastle 1.77 lock into android/build.gradle');
          }
          const appGradle = 'android/app/build.gradle';
          if (fs.existsSync(appGradle)) {
            let content = fs.readFileSync(appGradle, 'utf8');
            content += '\nconfigurations.all {\n    resolutionStrategy {\n        force \"org.bouncycastle:bcprov-jdk18on:1.77\"\n        force \"org.bouncycastle:bcpkix-jdk18on:1.77\"\n        force \"org.bouncycastle:bcutil-jdk18on:1.77\"\n    }\n}\n';
            fs.writeFileSync(appGradle, content, 'utf8');
            console.log('✅ Injected BouncyCastle 1.77 lock into android/app/build.gradle');
          }
          "

      - name: 🔨 Compile Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔑 Generate Unified Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias jam_alias -storepass jam_secure_password -keypass jam_secure_password -dname "CN=JAM, OU=JAM, O=JAM, L=Sanaa, S=Sanaa, C=YE"

      - name: ✍️ Align & Sign APK (${{ matrix.variant.apk_filename }})
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | head -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name zipalign | head -n 1)
          
          mkdir -p release-output
          
          SOURCE_APK=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found source APK at: $SOURCE_APK"
          
          $ZIPALIGN -p -f -v 4 "$SOURCE_APK" "release-output/temp_aligned.apk"
          $APKSIGNER sign --ks release.keystore --ks-key-alias jam_alias --ks-pass pass:jam_secure_password --key-pass pass:jam_secure_password --out "release-output/${{ matrix.variant.apk_filename }}" "release-output/temp_aligned.apk"
          rm -f "release-output/temp_aligned.apk"
          $APKSIGNER verify "release-output/${{ matrix.variant.apk_filename }}"
          
          echo "✅ Successfully aligned and signed: release-output/${{ matrix.variant.apk_filename }}"

      - name: 📤 Upload APK Artifact (${{ matrix.variant.artifact_name }})
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.variant.artifact_name }}
          path: release-output/${{ matrix.variant.apk_filename }}
          retention-days: 1
          if-no-files-found: ignore

      - name: 🚀 Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG_NAME="v4.0.1"
          RELEASE_TITLE="Jam store & Store pro - v4.0.1"
          APK_FILE="release-output/${{ matrix.variant.apk_filename }}"
          
          echo "Publishing $APK_FILE to release $TAG_NAME..."
          
          # Create release if not exists, or upload asset with clobber
          gh release create "$TAG_NAME" "$APK_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "### 🚀 روابط تحميل التطبيقات الرسمية المباشرة (الإصدار v4.0.1 - Build #${{ github.run_number }})"$'\n\n'"- 📱 تطبيق التجار والمتاجر: \`Jam-Store.apk\`"$'\n'"- 📱 تطبيق الزبائن والمواطنين: \`Store-Pro.apk\`"$'\n'"- 💻 برنامج سطح المكتب للويندوز: \`Jam-Store-Setup.exe\`" \
            --latest || gh release upload "$TAG_NAME" "$APK_FILE" --clobber
          
          # Also upload to latest-release tag for fixed permanent download link
          gh release create "latest" "$APK_FILE" \
            --title "Jam store & Store pro - Latest Release" \
            --notes "تحديث تلقائي لأحدث إصدار من المنظومة" || gh release upload "latest" "$APK_FILE" --clobber


  build-desktop-exe:
    name: 💻 Build Desktop Windows EXE (Jam store)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Clean Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -D @tailwindcss/oxide-win32-x64-msvc@^4.1.14 lightningcss-win32-x64-msvc@^1.29.1 @rollup/rollup-win32-x64-msvc@^4.63.1 --legacy-peer-deps
          npm install electron electron-builder sharp png-to-ico acorn --save-dev --legacy-peer-deps

      - name: 🌐 Build Web Assets
        run: |
          npm run build
          node scripts/obfuscate.cjs || true

      - name: 🎨 Build & Deploy Genuine Multi-Resolution Windows ICO
        run: |
          node scripts/build-frozen-icons.cjs
          node scripts/inject-frozen-icons.cjs JAM_STORE

      - name: ⚙️ Setup Electron & NSIS Packaging Configuration
        shell: bash
        run: |
          # 1. Create Hardened Electron Main process script
          cat << 'EOF' > electron-main.cjs
          const { app, BrowserWindow, shell, Menu } = require('electron');
          const path = require('path');

          function createWindow () {
            Menu.setApplicationMenu(null); // Disable menu bar entirely

            const win = new BrowserWindow({
              width: 1366,
              height: 768,
              minWidth: 1024,
              minHeight: 700,
              center: true,
              show: false,
              backgroundColor: '#05070e',
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                sandbox: true,
                devTools: false // 🛡️ Hardened against DevTools & inspection
              },
              title: "Jam store",
              autoHideMenuBar: true
            });

            win.setMenuBarVisibility(false);
            win.loadFile(path.join(__dirname, 'dist/index.html'));

            win.once('ready-to-show', () => {
              win.maximize();
              win.show();
            });

            // 🛡️ Prevent DevTools opening
            win.webContents.on('devtools-opened', () => {
              win.webContents.closeDevTools();
            });

            // 🛡️ Block inspection hotkeys
            win.webContents.on('before-input-event', (event, input) => {
              if (
                input.key === 'F12' ||
                (input.control && input.shift && ['i', 'j', 'c'].includes(input.key.toLowerCase())) ||
                (input.control && input.key.toLowerCase() === 'u')
              ) {
                event.preventDefault();
              }
            });

            win.webContents.setWindowOpenHandler(({ url }) => {
              shell.openExternal(url);
              return { action: 'deny' };
            });
          }

          app.whenReady().then(() => {
            createWindow();
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

          # 2. Configure package.json for Electron Builder with Maximum Compression
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = 'jam-store';
          pkg.version = '4.0.1';
          pkg.author = 'Jam store';
          pkg.description = 'Jam store Desktop Standalone POS & ERP System';
          pkg.main = 'electron-main.cjs';
          pkg.devDependencies = pkg.devDependencies || {};
          pkg.devDependencies['electron'] = '^30.0.0';
          pkg.devDependencies['electron-builder'] = '^24.13.3';
          pkg.scripts = pkg.scripts || {};
          pkg.scripts['electron:build'] = 'electron-builder --win --publish never';
          
          pkg.build = {
            appId: 'com.jam.store.desktop',
            productName: 'Jam store',
            publish: null,
            compression: 'maximum',
            forceCodeSigning: false,
            asar: true,
            directories: {
              output: 'dist-desktop',
              buildResources: 'build'
            },
            files: [
              'dist/**/*',
              'electron-main.cjs',
              'package.json'
            ],
            win: {
              icon: 'build/icon.ico',
              sign: null,
              verifyUpdateCodeSignature: false,
              target: [
                {
                  target: 'nsis',
                  arch: ['x64']
                }
              ]
            },
            nsis: {
              oneClick: false,
              allowToChangeInstallationDirectory: true,
              perMachine: false,
              differentialPackage: true,
              createDesktopShortcut: true,
              createStartMenuShortcut: true,
              shortcutName: 'Jam store',
              artifactName: 'Jam-Store-Setup.exe'
            }
          };
          
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: 🔨 Compile Windows NSIS Installer (.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run electron:build

      - name: 📤 Upload Windows Setup Installer EXE Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Jam-Store-Windows-Setup-EXE
          path: dist-desktop/*.exe
          retention-days: 1
          if-no-files-found: ignore

      - name: 🚀 Publish Windows EXE to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG_NAME="v4.0.1"
          RELEASE_TITLE="Jam store & Store pro - v4.0.1"
          
          # Find generated installer
          EXE_FILE=$(find dist-desktop -name "*.exe" | head -n 1)
          echo "Publishing $EXE_FILE to release $TAG_NAME..."
          
          if [ -n "$EXE_FILE" ]; then
            gh release create "$TAG_NAME" "$EXE_FILE" \
              --title "$RELEASE_TITLE" \
              --notes "### 🚀 روابط تحميل التطبيقات الرسمية المباشرة (الإصدار v4.0.1 - Build #${{ github.run_number }})"$'\n\n'"- 📱 تطبيق التجار والمتاجر: \`Jam-Store.apk\`"$'\n'"- 📱 تطبيق الزبائن والمواطنين: \`Store-Pro.apk\`"$'\n'"- 💻 برنامج سطح المكتب للويندوز: \`Jam-Store-Setup.exe\`" \
              --latest || gh release upload "$TAG_NAME" "$EXE_FILE" --clobber
            
            gh release create "latest" "$EXE_FILE" \
              --title "Jam store & Store pro - Latest Release" \
              --notes "تحديث تلقائي لأحدث إصدار من المنظومة" || gh release upload "latest" "$EXE_FILE" --clobber
          fi
