    <!-- Anti-Debugger disabled for stability in dev environment -->
    <script>
      (function() {
        function isScriptError(msg) {
          if (!msg) return true;
          var s = String(msg).toLowerCase();
          return s === 'script error.' || s === 'script error' || s.indexOf('script error') !== -1;
        }

        window.onerror = function(message, source, lineno, colno, error) {
          if (isScriptError(message)) {
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = event.message || (event.error && event.error.message) || '';
          if (isScriptError(msg)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason && (event.reason.message || event.reason) || '';
          if (isScriptError(reason)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
